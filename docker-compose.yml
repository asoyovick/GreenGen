services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: greengen
      POSTGRES_USER: greengen
      POSTGRES_PASSWORD: greengen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greengen -d greengen"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: golang:1.22-alpine
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: ["go", "run", "./cmd/api"]
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://greengen:greengen@db:5432/greengen?sslmode=disable
      AUTO_MIGRATE: "true"
      MIGRATIONS_PATH: ./migrations
      PYTHON_ENGINE_URL: ${PYTHON_ENGINE_URL:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Frontend is vanilla static files; serve with any static server, e.g.:
  # python -m http.server 5174 -d frontend-vanilla
  # Configure a real Python scientific engine via PYTHON_ENGINE_URL when available.
  # No synthetic data is used.
